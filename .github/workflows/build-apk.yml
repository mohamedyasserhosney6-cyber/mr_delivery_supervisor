name: Build Flutter APK

on:
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions
  push:
    branches:
      - main                # يشتغل أوتوماتيك على أي push للـ main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.0"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # هنا بنستخدم Flutter مباشرة بدل gradlew
      - name: Build release APK with Flutter
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr_delivery_supervisor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
